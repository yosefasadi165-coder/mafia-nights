<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شب‌های مافیا</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="eyebrow">MAFIA NIGHTS</div><h1>شب‌های مافیا</h1><p>بازی گروهی نقش مخفی</p></header><section id="setup" class="panel"><h2>ساخت بازی جدید</h2><label for="names">نام بازیکنان (هر نام در یک خط)</label><textarea id="names" rows="7" placeholder="علی&#10;سارا&#10;محمد&#10;..."></textarea><div class="row"><label for="mafiaCount">تعداد مافیا</label><select id="mafiaCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><button id="start">توزیع تصادفی نقش‌ها</button><p class="hint">حداقل ۵ بازیکن وارد کنید.</p></section><section id="reveal" class="panel hidden"><div id="progress" class="progress"></div><h2 id="playerTitle"></h2><p>گوشی را فقط به این بازیکن بدهید.</p><div id="roleCard" class="role hidden"><span>نقش شما</span><strong id="roleName"></strong><small id="roleInfo"></small></div><button id="showRole">نمایش نقش من</button><button id="nextPlayer" class="secondary hidden">پنهان کردن و نفر بعدی</button></section><section id="done" class="panel hidden"><h2>همه نقش‌ها توزیع شدند!</h2><p>حالا بازی را شروع کنید.</p><button id="again">بازی جدید</button></section><footer>ساخته‌شده برای شب‌های مافیا</footer></main><script src="app.js"></script></body></html>
